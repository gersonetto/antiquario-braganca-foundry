name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run prebuild
      - run: npm run build

      - run: cd dist && zip -r ../module.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.zip
            dist/module.json
          generate_release_notes: true
